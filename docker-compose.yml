services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: credit_anomaly
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d credit_anomaly"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  ingestion:
    build: ./ingestion
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://admin:admin@postgres:5432/credit_anomaly

  ai-service:
    build: ./ai-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://admin:admin@postgres:5432/credit_anomaly
      MODEL_DIR: /app/models
      REDIS_ADDR: redis:6379
      # local-dev-only key gating /debug/* and /train — never reuse this
      # value anywhere real; set your own via a real secret in production.
      ADMIN_API_KEY: local-dev-only-key
    volumes:
      - ai_models:/app/models
    ports:
      - "8000:8000"

volumes:
  pgdata:
  ai_models: